:root{--bg:#0b0d12;--panel:#141821;--line:#2a3140;--text:#e7eaf0;--muted:#98a2b3;--blue:#58c4dd;--yellow:#ffd23f}
*{box-sizing:border-box}

.card span{color:var(--muted);font-size:14px}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
